<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Photos | Lakshman ♥ Keerthana</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Georgia, 'Times New Roman', serif;
    background:#fff;
    color:#3a2330;
}

/* =========================
   NAVBAR
========================= */

.navbar{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,0.97);
    backdrop-filter:blur(10px);
    border-bottom:1px solid #eee;
    padding:18px 6%;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    text-decoration:none;
    color:#53152f;
    font-size:26px;
    font-weight:bold;
    letter-spacing:2px;
}

.nav-links{
    display:flex;
    gap:28px;
    align-items:center;
}

.nav-links a{
    text-decoration:none;
    color:#4a3040;
    font-size:14px;
    transition:0.3s;
}

.nav-links a:hover{
    color:#8d3158;
}

/* =========================
   HERO
========================= */

.photos-hero{
    text-align:center;
    padding:90px 20px 65px;
    background:
        radial-gradient(circle at top,#fff4f7 0%,#fff 55%);
}

.photos-hero .small-title{
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:12px;
    color:#9a496b;
    margin-bottom:18px;
}

.photos-hero h1{
    font-size:52px;
    color:#5a1833;
    margin-bottom:18px;
}

.photos-hero p{
    max-width:650px;
    margin:auto;
    color:#765968;
    font-size:17px;
    line-height:1.8;
}

/* =========================
   GALLERY
========================= */

.gallery-section{
    max-width:1250px;
    margin:auto;
    padding:30px 5% 80px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.photo-card{
    position:relative;
    overflow:hidden;
    border-radius:16px;
    background:#f8f1f4;
    cursor:pointer;
    aspect-ratio:4/3;
    box-shadow:0 8px 25px rgba(80,30,50,0.08);
}

.photo-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.5s ease;
}

.photo-card:hover img{
    transform:scale(1.06);
}

.photo-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(50,15,30,0.15),
        transparent 45%
    );
    pointer-events:none;
}

/* =========================
   PAGINATION
========================= */

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:55px;
    flex-wrap:wrap;
}

.page-btn,
.prev-next{
    border:none;
    background:transparent;
    color:#5d4050;
    min-width:42px;
    height:42px;
    border-radius:12px;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    transition:all 0.25s ease;
}

.page-btn:hover,
.prev-next:hover{
    background:#f6e7ed;
    color:#7c2349;
}

.page-btn.active{
    background:#8b3157;
    color:white;
    box-shadow:0 5px 15px rgba(139,49,87,0.25);
}

.prev-next{
    padding:0 14px;
    min-width:auto;
    font-weight:bold;
}

.prev-next:disabled{
    opacity:0.35;
    cursor:not-allowed;
    background:transparent;
}

.ellipsis{
    color:#8d7480;
    padding:0 3px;
}

/* =========================
   LIGHTBOX
========================= */

.lightbox{
    position:fixed;
    inset:0;
    z-index:3000;
    background:rgba(20,8,14,0.94);
    display:none;
    align-items:center;
    justify-content:center;
    padding:30px;
}

.lightbox.show{
    display:flex;
}

.lightbox-image{
    max-width:90vw;
    max-height:84vh;
    object-fit:contain;
    border-radius:8px;
    box-shadow:0 15px 60px rgba(0,0,0,0.5);
}

.close-btn{
    position:absolute;
    top:22px;
    right:28px;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:10;
}

.close-btn:hover{
    background:rgba(255,255,255,0.22);
}

.lightbox-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.14);
    color:white;
    font-size:30px;
    cursor:pointer;
    z-index:10;
}

.lightbox-nav:hover{
    background:rgba(255,255,255,0.25);
}

.lightbox-prev{
    left:25px;
}

.lightbox-next{
    right:25px;
}

.download-btn{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    text-decoration:none;
    color:white;
    background:#8b3157;
    padding:13px 24px;
    border-radius:30px;
    font-size:14px;
    font-weight:bold;
    transition:0.3s;
}

.download-btn:hover{
    background:#a3446b;
}

/* =========================
   FOOTER
========================= */

footer{
    background:#64183e;
    color:white;
    text-align:center;
    padding:38px 20px;
}

footer h3{
    font-size:18px;
    margin-bottom:8px;
}

footer p{
    font-size:13px;
    opacity:0.9;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    .nav-links{
        gap:15px;
    }

    .nav-links a{
        font-size:12px;
    }

    .photos-hero h1{
        font-size:40px;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:15px;
    }

}

@media(max-width:600px){

    .navbar{
        padding:15px 18px;
    }

    .brand{
        font-size:22px;
    }

    .nav-links{
        gap:10px;
        overflow-x:auto;
        white-space:nowrap;
        max-width:75%;
    }

    .nav-links a{
        font-size:11px;
    }

    .photos-hero{
        padding:65px 20px 45px;
    }

    .photos-hero h1{
        font-size:34px;
    }

    .photos-hero p{
        font-size:14px;
    }

    .gallery-section{
        padding:20px 15px 60px;
    }

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .photo-card{
        border-radius:11px;
    }

    .pagination{
        gap:5px;
        margin-top:40px;
    }

    .page-btn,
    .prev-next{
        min-width:38px;
        height:38px;
        font-size:13px;
    }

    .prev-next{
        padding:0 10px;
    }

    .lightbox{
        padding:15px;
    }

    .lightbox-image{
        max-width:95vw;
        max-height:80vh;
    }

    .lightbox-prev{
        left:10px;
    }

    .lightbox-next{
        right:10px;
    }

}

</style>
</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

    <a href="index.html" class="brand">
        L ♥ K
    </a>

    <div class="nav-links">

        <a href="index.html#story">
            Our Story
        </a>

        <a href="index.html#gallery">
            Moments
        </a>

        <a href="index.html#memories">
            Memories
        </a>

        <a href="photos.html">
            Photos
        </a>

        <a href="index.html#wedding">
            Wedding
        </a>

    </div>

</nav>


<!-- =========================
     HERO
========================= -->

<section class="photos-hero">

    <div class="small-title">
        Lakshman ♥ Keerthana
    </div>

    <h1>
        All Our Photos
    </h1>

    <p>
        A collection of beautiful moments, memories and celebrations.
        Tap any photo to view it in full screen.
    </p>

</section>


<!-- =========================
     GALLERY
========================= -->

<section class="gallery-section">

    <div class="gallery" id="gallery"></div>

    <!-- PAGINATION -->
    <div class="pagination" id="pagination"></div>

</section>


<!-- =========================
     LIGHTBOX
========================= -->

<div class="lightbox" id="lightbox">

    <button class="close-btn" id="closeBtn">
        ×
    </button>

    <button class="lightbox-nav lightbox-prev" id="prevBtn">
        ‹
    </button>

    <img
        id="lightboxImage"
        class="lightbox-image"
        src=""
        alt="Engagement photo"
    >

    <button class="lightbox-nav lightbox-next" id="nextBtn">
        ›
    </button>

    <a
        id="downloadBtn"
        class="download-btn"
        href=""
        download
    >
        Download Photo
    </a>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <h3>
        Lakshman ♥ Keerthana
    </h3>

    <p>
        Engagement memories · Made with love
    </p>

</footer>


<script>

/* ==========================================
   PHOTOS 013.jpg → 326.jpg
========================================== */

const photoFiles = Array.from(
    { length: 314 },
    (_, i) => `images/${String(i + 13).padStart(3, '0')}.jpg`
);


/* ==========================================
   SETTINGS
========================================== */

const perPage = 12;

let currentPage = 1;

const totalPages = Math.ceil(photoFiles.length / perPage);


/* ==========================================
   ELEMENTS
========================================== */

const gallery =
    document.getElementById("gallery");

const pagination =
    document.getElementById("pagination");

const lightbox =
    document.getElementById("lightbox");

const lightboxImage =
    document.getElementById("lightboxImage");

const closeBtn =
    document.getElementById("closeBtn");

const prevBtn =
    document.getElementById("prevBtn");

const nextBtn =
    document.getElementById("nextBtn");

const downloadBtn =
    document.getElementById("downloadBtn");


/* ==========================================
   CURRENT LIGHTBOX PHOTO
========================================== */

let currentPhotoIndex = 0;


/* ==========================================
   RENDER GALLERY
========================================== */

function renderGallery(){

    gallery.innerHTML = "";

    const start =
        (currentPage - 1) * perPage;

    const end =
        Math.min(
            start + perPage,
            photoFiles.length
        );

    for(let i = start; i < end; i++){

        const card =
            document.createElement("div");

        card.className = "photo-card";

        const img =
            document.createElement("img");

        img.src = photoFiles[i];

        /* No serial number */
        img.alt = "Engagement photo";

        img.loading = "lazy";
        img.decoding = "async";

        card.appendChild(img);

        card.addEventListener("click", () => {

            openLightbox(i);

        });

        gallery.appendChild(card);
    }
}


/* ==========================================
   PAGINATION
========================================== */

function renderPagination(){

    pagination.innerHTML = "";

    /* PREVIOUS */

    const previous =
        document.createElement("button");

    previous.className = "prev-next";

    previous.textContent = "Previous";

    previous.disabled =
        currentPage === 1;

    previous.addEventListener("click", () => {

        if(currentPage > 1){

            currentPage--;

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });
        }

    });

    pagination.appendChild(previous);


    /* ======================================
       ONLY 3 PAGE NUMBERS AT A TIME
    ====================================== */

    let startPage;
    let endPage;

    if(totalPages <= 3){

        startPage = 1;
        endPage = totalPages;

    }
    else if(currentPage === 1){

        startPage = 1;
        endPage = 3;

    }
    else if(currentPage === totalPages){

        startPage = totalPages - 2;
        endPage = totalPages;

    }
    else{

        startPage = currentPage - 1;
        endPage = currentPage + 1;

    }


    /* ======================================
       FIRST PAGE WHEN WINDOW IS NOT AT START
    ====================================== */

    if(startPage > 1){

        const first =
            document.createElement("button");

        first.className = "page-btn";

        first.textContent = "1";

        first.addEventListener("click", () => {

            currentPage = 1;

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        });

        pagination.appendChild(first);

        if(startPage > 2){

            const dots =
                document.createElement("span");

            dots.className = "ellipsis";

            dots.textContent = "…";

            pagination.appendChild(dots);

        }

    }


    /* ======================================
       PAGE NUMBERS
    ====================================== */

    for(
        let page = startPage;
        page <= endPage;
        page++
    ){

        const button =
            document.createElement("button");

        button.className = "page-btn";

        button.textContent = page;

        if(page === currentPage){

            button.classList.add("active");

        }

        button.addEventListener("click", () => {

            currentPage = page;

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        });

        pagination.appendChild(button);

    }


    /* ======================================
       LAST PAGE
    ====================================== */

    if(endPage < totalPages){

        if(endPage < totalPages - 1){

            const dots =
                document.createElement("span");

            dots.className = "ellipsis";

            dots.textContent = "…";

            pagination.appendChild(dots);

        }

        const last =
            document.createElement("button");

        last.className = "page-btn";

        last.textContent = totalPages;

        last.addEventListener("click", () => {

            currentPage = totalPages;

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        });

        pagination.appendChild(last);

    }


    /* ======================================
       NEXT
    ====================================== */

    const next =
        document.createElement("button");

    next.className = "prev-next";

    next.textContent = "Next";

    next.disabled =
        currentPage === totalPages;

    next.addEventListener("click", () => {

        if(currentPage < totalPages){

            currentPage++;

            render();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }

    });

    pagination.appendChild(next);

}


/* ==========================================
   RENDER EVERYTHING
========================================== */

function render(){

    renderGallery();

    renderPagination();

}


/* ==========================================
   OPEN LIGHTBOX
========================================== */

function openLightbox(index){

    currentPhotoIndex = index;

    lightboxImage.src =
        photoFiles[currentPhotoIndex];

    downloadBtn.href =
        photoFiles[currentPhotoIndex];

    lightbox.classList.add("show");

    document.body.style.overflow = "hidden";

}


/* ==========================================
   CLOSE LIGHTBOX
========================================== */

function closeLightbox(){

    lightbox.classList.remove("show");

    document.body.style.overflow = "";

}


/* ==========================================
   NEXT PHOTO
========================================== */

function showNextPhoto(){

    currentPhotoIndex++;

    if(
        currentPhotoIndex >=
        photoFiles.length
    ){

        currentPhotoIndex = 0;

    }

    lightboxImage.src =
        photoFiles[currentPhotoIndex];

    downloadBtn.href =
        photoFiles[currentPhotoIndex];

}


/* ==========================================
   PREVIOUS PHOTO
========================================== */

function showPreviousPhoto(){

    currentPhotoIndex--;

    if(currentPhotoIndex < 0){

        currentPhotoIndex =
            photoFiles.length - 1;

    }

    lightboxImage.src =
        photoFiles[currentPhotoIndex];

    downloadBtn.href =
        photoFiles[currentPhotoIndex];

}


/* ==========================================
   BUTTON EVENTS
========================================== */

closeBtn.addEventListener(
    "click",
    closeLightbox
);

nextBtn.addEventListener(
    "click",
    showNextPhoto
);

prevBtn.addEventListener(
    "click",
    showPreviousPhoto
);


/* ==========================================
   CLICK OUTSIDE IMAGE
========================================== */

lightbox.addEventListener(
    "click",
    (event) => {

        if(event.target === lightbox){

            closeLightbox();

        }

    }
);


/* ==========================================
   KEYBOARD CONTROLS
========================================== */

document.addEventListener(
    "keydown",
    (event) => {

        if(!lightbox.classList.contains("show")){

            return;

        }

        if(event.key === "Escape"){

            closeLightbox();

        }

        if(event.key === "ArrowRight"){

            showNextPhoto();

        }

        if(event.key === "ArrowLeft"){

            showPreviousPhoto();

        }

    }
);


/* ==========================================
   START
========================================== */

render();

</script>

</body>
</html>
