<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7b1e35">
<title>Photos | Lakshman ♥ Keerthana</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
:root{--wine:#741d34;--wine-dark:#4b1123;--rose:#b85c70;--cream:#fffaf6;--paper:#fffdfb;--gold:#c79b58;--ink:#30252a;--muted:#756b70;--line:rgba(116,29,52,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}button{font:inherit}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,5vw,72px);background:rgba(255,253,251,.94);backdrop-filter:blur(18px);color:var(--wine);box-shadow:0 8px 30px rgba(0,0,0,.07)}
.brand{font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:700;letter-spacing:.03em}.nav-links{display:flex;gap:26px;font-size:13px;font-weight:600;letter-spacing:.05em}.nav-links a:hover{color:var(--gold)}.menu{display:none;border:0;background:transparent;color:inherit;font-size:25px}
.hero{padding:92px 18px 65px;text-align:center;background:linear-gradient(135deg,#4b1123,#741d34);color:#fff}.kicker{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#f3c9d1;font-weight:700}.hero h1{font-family:"Cormorant Garamond",serif;font-size:clamp(52px,8vw,88px);line-height:.95;margin:12px 0}.hero p{margin:16px auto 0;max-width:620px;color:#f8e6eb;font-size:15px}

.gallery-wrap{max-width:1180px;margin:auto;padding:70px clamp(18px,5vw,60px)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.photo{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:18px;background:#eee;cursor:pointer;box-shadow:0 12px 35px rgba(57,20,32,.10)}.photo img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}.photo:hover img{transform:scale(1.045)}.photo-number{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);color:var(--wine);padding:5px 9px;border-radius:99px;font-size:10px;font-weight:600}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:42px;flex-wrap:wrap}.pagination button{min-width:42px;height:42px;border:1px solid var(--line);background:#fff;color:var(--wine);border-radius:12px;cursor:pointer;font-weight:600}.pagination button:hover,.pagination button.active{background:var(--wine);color:#fff}.pagination button:disabled{opacity:.35;cursor:not-allowed}
footer{text-align:center;background:#310d1b;color:#ead8de;padding:28px 18px;font-size:11px;letter-spacing:.08em}footer strong{color:#fff;font-family:"Cormorant Garamond",serif;font-size:18px;letter-spacing:0}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(12,7,10,.94);display:none;place-items:center;padding:20px}.lightbox.open{display:grid}.lightbox img{max-width:min(1100px,94vw);max-height:88vh;object-fit:contain;border-radius:12px}.close,.lb-prev,.lb-next,.download{position:absolute;border:0;background:rgba(255,255,255,.13);color:#fff;cursor:pointer}.close{top:18px;right:22px;border-radius:50%;width:44px;height:44px;font-size:27px}.lb-prev,.lb-next{top:50%;transform:translateY(-50%);border-radius:50%;width:48px;height:48px;font-size:28px}.lb-prev{left:20px}.lb-next{right:20px}.download{bottom:22px;left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:99px;background:#fff;color:var(--wine);font-weight:600}
@media(max-width:760px){nav{padding:13px 18px}.brand{font-size:22px}.nav-links{display:none}.menu{display:block}.nav.open .nav-links{display:flex;position:absolute;top:58px;left:12px;right:12px;flex-direction:column;gap:0;background:rgba(255,253,251,.98);color:var(--wine);border-radius:18px;padding:8px;box-shadow:0 18px 45px rgba(0,0,0,.15)}.nav.open .nav-links a{padding:13px 15px;border-radius:12px}.hero{padding:72px 18px 50px}.gallery-wrap{padding:45px 14px}.gallery{grid-template-columns:repeat(2,1fr);gap:10px}.photo{border-radius:12px}.photo-number{left:8px;top:8px;font-size:9px;padding:4px 7px}.lb-prev{left:8px}.lb-next{right:8px}.lightbox{padding:10px}.lightbox img{max-width:98vw;max-height:82vh}.download{bottom:16px}}
</style>
</head>
<body>
<nav class="nav" id="nav"><a class="brand" href="index.html">L ♥ K</a><div class="nav-links"><a href="index.html#story">Our Story</a><a href="index.html#gallery">Moments</a><a href="index.html#memories">Memories</a><a href="photos.html">Photos</a><a href="index.html#wedding">Wedding</a></div><button class="menu" id="menu" aria-label="Open menu">☰</button></nav>
<header class="hero"><div class="kicker">Captured with love · Engagement</div><h1>All Our Photos</h1><p>A special collection of engagement memories. Tap any photo to view it full screen.</p></header>
<main class="gallery-wrap"><div class="gallery" id="gallery"></div><div class="pagination" id="pagination"></div></main>
<footer><strong>Lakshman ♥ Keerthana</strong><br><span>Engagement memories · Made with love</span></footer>
<div class="lightbox" id="lightbox" aria-hidden="true"><button class="close" id="close" aria-label="Close">×</button><button class="lb-prev" id="prev" aria-label="Previous">‹</button><img id="lbImage" src="" alt=""><button class="lb-next" id="next" aria-label="Next">›</button><a class="download" id="download" href="#" download>Download Photo</a></div>
<script>
const photoFiles=[
'images/family-portrait.jpeg','images/garland-moment.jpeg','images/close-embrace.jpeg','images/proposal-moment.jpeg','images/smiling-together.jpeg','images/forehead-kiss.jpeg','images/classic-portrait.jpeg','images/together-traditional.jpeg','images/family-celebration.jpeg','images/couple-portrait.jpeg','images/groom-portrait.jpeg','images/engagement-stage.jpeg'
];
const perPage=9;let page=1;let current=0;
const gallery=document.getElementById('gallery'),pagination=document.getElementById('pagination'),lightbox=document.getElementById('lightbox'),lbImage=document.getElementById('lbImage'),download=document.getElementById('download');
function render(){const total=Math.ceil(photoFiles.length/perPage);if(page>total)page=total||1;gallery.innerHTML='';const start=(page-1)*perPage;photoFiles.slice(start,start+perPage).forEach((src,i)=>{const n=start+i+1;const div=document.createElement('div');div.className='photo';div.innerHTML=`<img src="${src}" alt="Engagement photo ${n}" loading="lazy"><span class="photo-number">${n}</span>`;div.onclick=()=>openBox(n-1);gallery.appendChild(div)});pagination.innerHTML='';const prev=document.createElement('button');prev.textContent='‹';prev.disabled=page===1;prev.onclick=()=>{page--;render();scrollTo({top:gallery.offsetTop-90,behavior:'smooth'})};pagination.appendChild(prev);for(let i=1;i<=total;i++){const b=document.createElement('button');b.textContent=i;b.className=i===page?'active':'';b.onclick=()=>{page=i;render();scrollTo({top:gallery.offsetTop-90,behavior:'smooth'})};pagination.appendChild(b)}const next=document.createElement('button');next.textContent='›';next.disabled=page===total;next.onclick=()=>{page++;render();scrollTo({top:gallery.offsetTop-90,behavior:'smooth'})};pagination.appendChild(next)}
function openBox(i){current=(i+photoFiles.length)%photoFiles.length;lbImage.src=photoFiles[current];lbImage.alt='Engagement photo '+(current+1);download.href=photoFiles[current];download.download=photoFiles[current].split('/').pop();lightbox.classList.add('open');lightbox.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeBox(){lightbox.classList.remove('open');lightbox.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.getElementById('close').onclick=closeBox;document.getElementById('prev').onclick=()=>openBox(current-1);document.getElementById('next').onclick=()=>openBox(current+1);lightbox.onclick=e=>{if(e.target===lightbox)closeBox()};document.addEventListener('keydown',e=>{if(!lightbox.classList.contains('open'))return;if(e.key==='Escape')closeBox();if(e.key==='ArrowLeft')openBox(current-1);if(e.key==='ArrowRight')openBox(current+1)});
const menu=document.getElementById('menu'),nav=document.getElementById('nav');menu.onclick=()=>nav.classList.toggle('open');document.querySelectorAll('.nav-links a').forEach(a=>a.onclick=()=>nav.classList.remove('open'));
render();
</script>
</body>
</html>
