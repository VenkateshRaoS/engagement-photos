<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7b1e35">
  <meta name="description" content="Engagement photos of Lakshman and Keerthana.">
  <title>Photos | Lakshman ♥ Keerthana</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --wine:#741d34;
      --wine-dark:#4b1123;
      --rose:#b85c70;
      --cream:#fffaf6;
      --paper:#fffdfb;
      --gold:#c79b58;
      --ink:#30252a;
      --muted:#756b70;
      --line:rgba(116,29,52,.13);
      --shadow:0 18px 55px rgba(57,20,32,.12);
    }

    * { box-sizing:border-box; }

    html { scroll-behavior:smooth; }

    body {
      margin:0;
      background:var(--cream);
      color:var(--ink);
      font-family:Inter,system-ui,sans-serif;
      line-height:1.6;
    }

    a { color:inherit; text-decoration:none; }
    button { font:inherit; }

    .nav {
      position:sticky;
      top:0;
      z-index:20;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px clamp(18px,5vw,72px);
      background:rgba(255,253,251,.94);
      backdrop-filter:blur(18px);
      color:var(--wine);
      box-shadow:0 8px 30px rgba(0,0,0,.07);
    }

    .brand {
      font-family:"Cormorant Garamond",serif;
      font-size:25px;
      font-weight:700;
      letter-spacing:.03em;
    }

    .nav-links {
      display:flex;
      gap:26px;
      font-size:13px;
      font-weight:600;
      letter-spacing:.05em;
    }

    .nav-links a:hover { color:var(--gold); }

    .menu {
      display:none;
      border:0;
      background:transparent;
      color:inherit;
      font-size:25px;
      cursor:pointer;
    }

    .page-hero {
      padding:86px 18px 52px;
      text-align:center;
      background:
        radial-gradient(circle at top, rgba(184,92,112,.10), transparent 48%),
        var(--cream);
    }

    .kicker {
      font-size:11px;
      letter-spacing:.24em;
      text-transform:uppercase;
      color:var(--rose);
      font-weight:700;
    }

    h1 {
      margin:10px 0 8px;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(48px,7vw,76px);
      line-height:.95;
      color:var(--wine-dark);
    }

    .subtitle {
      margin:0 auto;
      max-width:650px;
      color:var(--muted);
      font-size:14px;
    }

    .photo-section {
      padding:20px clamp(16px,5vw,72px) 90px;
    }

    .photo-grid {
      width:min(1120px,100%);
      margin:0 auto;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .photo-card {
      position:relative;
      overflow:hidden;
      aspect-ratio:1 / 1;
      border-radius:20px;
      background:#eee;
      cursor:pointer;
      box-shadow:var(--shadow);
      border:1px solid rgba(116,29,52,.08);
    }

    .photo-card img {
      width:100%;
      height:100%;
      object-fit:cover;
      transition:transform .5s ease;
    }

    .photo-card:hover img { transform:scale(1.05); }

    .photo-number {
      position:absolute;
      left:12px;
      bottom:12px;
      padding:6px 9px;
      border-radius:99px;
      background:rgba(255,255,255,.9);
      color:var(--wine);
      font-size:10px;
      font-weight:600;
      letter-spacing:.08em;
    }

    .pagination {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      margin:40px auto 0;
      flex-wrap:wrap;
    }

    .page-btn {
      min-width:42px;
      height:42px;
      padding:0 13px;
      border:1px solid var(--line);
      border-radius:50%;
      background:#fff;
      color:var(--wine);
      cursor:pointer;
      font-weight:600;
      transition:.25s ease;
    }

    .page-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 8px 22px rgba(57,20,32,.10);
    }

    .page-btn.active {
      background:var(--wine);
      color:#fff;
      border-color:var(--wine);
    }

    .page-btn.arrow {
      border-radius:99px;
      padding:0 17px;
    }

    .page-info {
      width:100%;
      text-align:center;
      margin-top:10px;
      color:var(--muted);
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    footer {
      background:#310d1b;
      color:#ead8de;
      text-align:center;
      padding:28px 18px;
      font-size:11px;
      letter-spacing:.08em;
    }

    footer strong {
      color:#fff;
      font-family:"Cormorant Garamond",serif;
      font-size:18px;
      letter-spacing:0;
    }

    /* Full-screen viewer */
    .lightbox {
      position:fixed;
      inset:0;
      z-index:50;
      background:rgba(12,7,10,.94);
      display:none;
      place-items:center;
      padding:20px;
    }

    .lightbox.open { display:grid; }

    .lightbox img {
      max-width:min(1100px,94vw);
      max-height:84vh;
      object-fit:contain;
      border-radius:12px;
      user-select:none;
    }

    .close,
    .lb-prev,
    .lb-next,
    .download {
      position:absolute;
      border:0;
      background:rgba(255,255,255,.13);
      color:#fff;
      cursor:pointer;
      backdrop-filter:blur(8px);
    }

    .close {
      top:18px;
      right:22px;
      width:44px;
      height:44px;
      border-radius:50%;
      font-size:27px;
    }

    .lb-prev,
    .lb-next {
      top:50%;
      transform:translateY(-50%);
      width:48px;
      height:48px;
      border-radius:50%;
      font-size:27px;
    }

    .lb-prev { left:20px; }
    .lb-next { right:20px; }

    .download {
      left:50%;
      bottom:22px;
      transform:translateX(-50%);
      border-radius:99px;
      padding:10px 18px;
      font-size:12px;
      font-weight:600;
    }

    @media(max-width:760px) {
      .nav { padding:13px 18px; }

      .brand { font-size:22px; }

      .nav-links { display:none; }

      .menu { display:block; }

      .nav.open .nav-links {
        display:flex;
        position:absolute;
        top:58px;
        left:12px;
        right:12px;
        flex-direction:column;
        gap:0;
        background:rgba(255,253,251,.98);
        color:var(--wine);
        border-radius:18px;
        padding:8px;
        box-shadow:0 18px 45px rgba(0,0,0,.15);
      }

      .nav.open .nav-links a {
        padding:13px 15px;
        border-radius:12px;
      }

      .page-hero {
        padding:58px 18px 35px;
      }

      h1 { font-size:52px; }

      .photo-section {
        padding:10px 12px 70px;
      }

      .photo-grid {
        grid-template-columns:repeat(2,1fr);
        gap:10px;
      }

      .photo-card {
        border-radius:14px;
      }

      .photo-number {
        left:8px;
        bottom:8px;
        font-size:8px;
        padding:5px 7px;
      }

      .lb-prev { left:8px; }
      .lb-next { right:8px; }

      .lightbox { padding:12px; }

      .lightbox img {
        max-width:96vw;
        max-height:80vh;
      }
    }
  </style>
</head>

<body>

  <nav class="nav" id="nav">
    <a class="brand" href="index.html">L ♥ K</a>

    <div class="nav-links">
      <a href="index.html#story">Our Story</a>
      <a href="index.html#gallery">Moments</a>
      <a href="index.html#memories">Memories</a>
      <a href="photos.html">Photos</a>
    </div>

    <button class="menu" id="menu" aria-label="Open menu">☰</button>
  </nav>

  <main>
    <section class="page-hero">
      <div class="kicker">Captured with love</div>
      <h1>Photos</h1>
      <p class="subtitle">
        Every smile, blessing and beautiful moment from Lakshman ♥ Keerthana's engagement.
      </p>
    </section>

    <section class="photo-section">
      <div class="photo-grid" id="photoGrid"></div>

      <div class="pagination" id="pagination"></div>
      <div class="page-info" id="pageInfo"></div>
    </section>
  </main>

  <footer>
    <strong>Lakshman ♥ Keerthana</strong>
    <br>
    <span>Engagement memories · Made with love</span>
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="close" aria-label="Close">×</button>
    <button class="lb-prev" id="prev" aria-label="Previous">‹</button>

    <img id="lbImage" src="" alt="">

    <button class="lb-next" id="next" aria-label="Next">›</button>
    <a class="download" id="download" href="#" download>Download photo</a>
  </div>

  <script>
    /*
      ADD YOUR PHOTOS HERE.

      Keep the existing photos below.
      For more photos, add more lines:
      "images/photo-013.jpeg",
      "images/photo-014.jpeg",
      "images/photo-015.jpeg",

      The page automatically creates 9 photos per page.
    */

    const photoFiles = [
      "images/family-portrait.jpeg",
      "images/garland-moment.jpeg",
      "images/close-embrace.jpeg",
      "images/proposal-moment.jpeg",
      "images/smiling-together.jpeg",
      "images/forehead-kiss.jpeg",
      "images/classic-portrait.jpeg",
      "images/together-traditional.jpeg",
      "images/family-celebration.jpeg",
      "images/couple-portrait.jpeg",
      "images/groom-portrait.jpeg",
      "images/engagement-stage.jpeg"
    ];

    const perPage = 9;
    let currentPage = 1;
    let currentPhoto = 0;

    const grid = document.getElementById("photoGrid");
    const pagination = document.getElementById("pagination");
    const pageInfo = document.getElementById("pageInfo");

    const lightbox = document.getElementById("lightbox");
    const lbImage = document.getElementById("lbImage");
    const download = document.getElementById("download");

    function totalPages() {
      return Math.ceil(photoFiles.length / perPage);
    }

    function renderPhotos() {
      grid.innerHTML = "";

      const start = (currentPage - 1) * perPage;
      const end = Math.min(start + perPage, photoFiles.length);

      for (let i = start; i < end; i++) {
        const card = document.createElement("div");
        card.className = "photo-card";

        const img = document.createElement("img");
        img.src = photoFiles[i];
        img.alt = "Engagement photo " + (i + 1);
        img.loading = "lazy";

        const number = document.createElement("span");
        number.className = "photo-number";
        number.textContent = String(i + 1).padStart(2, "0");

        card.appendChild(img);
        card.appendChild(number);

        card.addEventListener("click", () => openPhoto(i));
        grid.appendChild(card);
      }

      renderPagination();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderPagination() {
      pagination.innerHTML = "";

      const pages = totalPages();

      if (pages <= 1) {
        pageInfo.textContent = photoFiles.length + " photos";
        return;
      }

      const prev = document.createElement("button");
      prev.className = "page-btn arrow";
      prev.textContent = "‹";
      prev.setAttribute("aria-label", "Previous page");
      prev.disabled = currentPage === 1;
      prev.onclick = () => {
        if (currentPage > 1) {
          currentPage--;
          renderPhotos();
        }
      };
      pagination.appendChild(prev);

      for (let i = 1; i <= pages; i++) {
        const btn = document.createElement("button");
        btn.className = "page-btn" + (i === currentPage ? " active" : "");
        btn.textContent = i;
        btn.setAttribute("aria-label", "Page " + i);
        btn.onclick = () => {
          currentPage = i;
          renderPhotos();
        };
        pagination.appendChild(btn);
      }

      const next = document.createElement("button");
      next.className = "page-btn arrow";
      next.textContent = "›";
      next.setAttribute("aria-label", "Next page");
      next.disabled = currentPage === pages;
      next.onclick = () => {
        if (currentPage < pages) {
          currentPage++;
          renderPhotos();
        }
      };
      pagination.appendChild(next);

      const start = (currentPage - 1) * perPage + 1;
      const end = Math.min(currentPage * perPage, photoFiles.length);
      pageInfo.textContent = "Photos " + start + "–" + end + " of " + photoFiles.length;
    }

    function openPhoto(index) {
      currentPhoto = index;
      lbImage.src = photoFiles[currentPhoto];
      lbImage.alt = "Engagement photo " + (currentPhoto + 1);
      download.href = photoFiles[currentPhoto];
      download.download = "engagement-photo-" +
        String(currentPhoto + 1).padStart(3, "0") + ".jpeg";

      lightbox.classList.add("open");
      lightbox.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeBox() {
      lightbox.classList.remove("open");
      lightbox.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function showNext() {
      currentPhoto = (currentPhoto + 1) % photoFiles.length;
      openPhoto(currentPhoto);
    }

    function showPrev() {
      currentPhoto = (currentPhoto - 1 + photoFiles.length) % photoFiles.length;
      openPhoto(currentPhoto);
    }

    document.getElementById("close").onclick = closeBox;
    document.getElementById("next").onclick = showNext;
    document.getElementById("prev").onclick = showPrev;

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox) closeBox();
    });

    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;

      if (e.key === "Escape") closeBox();
      if (e.key === "ArrowRight") showNext();
      if (e.key === "ArrowLeft") showPrev();
    });

    const nav = document.getElementById("nav");
    const menu = document.getElementById("menu");

    menu.addEventListener("click", () => {
      nav.classList.toggle("open");
    });

    document.querySelectorAll(".nav-links a").forEach(a => {
      a.addEventListener("click", () => nav.classList.remove("open"));
    });

    renderPhotos();
  </script>

</body>
</html>
