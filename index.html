<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keerthana A & Lakshman Rao G - Engagement</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         START PAGE
    ========================== -->

    <section
        class="start-page"
        id="startPage"
        onclick="openGallery()"
        role="button"
        aria-label="Open engagement photos"
    >

        <img
            src="start.png"
            alt="Keerthana A and Lakshman Rao G Engagement"
            class="start-image"
        >

        <div class="tap-hint">
            Tap to view photos
        </div>

    </section>


    <!-- =========================
         GALLERY
    ========================== -->

    <section class="gallery-section" id="gallery">

        <h1 class="gallery-title">
            Engagement Memories
        </h1>

        <p class="gallery-subtitle">
            Keerthana A & Lakshman Rao G
        </p>


        <!-- Photos will appear here -->
        <div
            class="photo-grid"
            id="photoGrid"
        ></div>


        <!-- =========================
             PAGE NUMBERS
        ========================== -->

        <div
            class="pagination"
            id="pagination"
        ></div>


        <!-- Back to beginning -->

        <div class="back-home">

            <button onclick="goToStart()">
                ↑ Back to Beginning
            </button>

        </div>

    </section>


    <!-- =========================
         FULL SCREEN PHOTO VIEWER
    ========================== -->

    <div
        class="viewer"
        id="viewer"
    >

        <button
            class="close-btn"
            onclick="closeViewer()"
            aria-label="Close photo"
        >
            ×
        </button>


        <button
            class="nav-btn previous"
            onclick="previousPhoto()"
            aria-label="Previous photo"
        >
            ‹
        </button>


        <div class="photo-container">

            <img
                id="largePhoto"
                src=""
                alt="Engagement photo"
            >


            <div class="photo-info">

                <span
                    id="photoNumber"
                    class="photo-number"
                >
                    1 / 12
                </span>


                <a
                    id="downloadLink"
                    class="download-btn"
                    href="#"
                    download
                >
                    <span>⬇</span>
                    Download Photo
                </a>

            </div>

        </div>


        <button
            class="nav-btn next"
            onclick="nextPhoto()"
            aria-label="Next photo"
        >
            ›
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
