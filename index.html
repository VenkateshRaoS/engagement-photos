<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keerthana A & Lakshman Rao G - Engagement</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         FRONT PAGE
    ========================== -->

    <section
        class="start-page"
        id="startPage"
        onclick="openGallery()"
    >

        <div class="invitation">

            <div class="top-decoration">
                ❀　❁　✿　❁　❀
            </div>

            <p class="small-title">
                OUR ENGAGEMENT
            </p>

            <h1>
                Keerthana A
            </h1>

            <div class="heart">
                ♥
            </div>

            <h1>
                Lakshman Rao G
            </h1>

            <p class="journey">
                TWO HEARTS · ONE BEAUTIFUL JOURNEY
            </p>


            <!-- YOUR ACTUAL PHOTO -->

            <div class="couple-photo">
                <img
                    src="photos/001.jpeg"
                    alt="Keerthana A and Lakshman Rao G"
                >
            </div>


            <div class="tap-button">
                <span>☝</span>
                <span>Tap anywhere to view photos</span>
            </div>


            <div class="bottom-decoration">
                ♥
            </div>

            <p class="chapter">
                A NEW CHAPTER BEGINS
            </p>

        </div>

    </section>


    <!-- =========================
         GALLERY
    ========================== -->

    <section
        class="gallery-section"
        id="gallery"
    >

        <h2 class="gallery-title">
            Engagement Memories
        </h2>

        <p class="gallery-subtitle">
            Keerthana A & Lakshman Rao G
        </p>


        <div
            class="photo-grid"
            id="photoGrid"
        ></div>


        <div
            class="pagination"
            id="pagination"
        ></div>


        <div class="back-home">

            <button onclick="goToStart()">
                ↑ Back to Beginning
            </button>

        </div>

    </section>


    <!-- =========================
         FULL SCREEN VIEWER
    ========================== -->

    <div
        class="viewer"
        id="viewer"
    >

        <button
            class="close-btn"
            onclick="closeViewer()"
        >
            ×
        </button>


        <button
            class="nav-btn previous"
            onclick="previousPhoto()"
        >
            ‹
        </button>


        <div class="photo-container">

            <img
                id="largePhoto"
                src=""
                alt="Engagement photo"
            >

            <div class="photo-info">

                <span
                    id="photoNumber"
                    class="photo-number"
                >
                    1 / 12
                </span>

                <a
                    id="downloadLink"
                    class="download-btn"
                    href="#"
                    download
                >
                    ⬇ Download Photo
                </a>

            </div>

        </div>


        <button
            class="nav-btn next"
            onclick="nextPhoto()"
        >
            ›
        </button>

    </div>


    <script src="script.js"></script>

</body>
</html>
